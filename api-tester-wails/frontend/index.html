<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Tester</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    header {
      height: 52px;
      padding: 0 20px;
      border-bottom: 1px solid #334155;
      background: #1e293b;
      font-weight: 600;
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      height: calc(100% - 52px);
      padding: 16px;
    }
    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; height: auto; }
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 14px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    select, input, textarea, button {
      font: inherit;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      padding: 9px 11px;
      outline: none;
    }
    select { width: 110px; cursor: pointer; }
    input { flex: 1; }
    textarea {
      width: 100%;
      flex: 1;
      min-height: 90px;
      resize: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      color: #94a3b8;
    }
    button {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      padding: 9px 22px;
    }
    button:hover { background: #2563eb; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .meta {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .badge {
      font-size: 13px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 4px;
      background: #334155;
    }
    .badge.ok { background: #166534; color: #bbf7d0; }
    .badge.warn { background: #713f12; color: #fef08a; }
    .badge.err { background: #7f1d1d; color: #fecaca; }
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid #334155;
      margin-bottom: 10px;
    }
    .tab {
      padding: 7px 12px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      color: #94a3b8;
      font-size: 12px;
    }
    .tab.active { color: #e2e8f0; border-color: #3b82f6; }
    .tab-content { display: none; flex: 1; min-height: 0; }
    .tab-content.active { display: flex; flex-direction: column; }
    pre {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      margin: 0;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }
    .headers-table { width: 100%; border-collapse: collapse; }
    .headers-table td { padding: 7px; border-bottom: 1px solid #334155; font-size: 12px; }
    .headers-table td:first-child { color: #94a3b8; width: 30%; vertical-align: top; }
    .error { color: #fecaca; }
    .hint { font-size: 11px; color: #64748b; margin-top: 3px; }
    .field { display: flex; flex-direction: column; flex: 1; min-height: 0; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header>
    <span>🚀</span> API Tester
  </header>

  <div class="container">
    <div class="panel">
      <h2>Request</h2>

      <div class="row">
        <select id="method">
          <option>GET</option>
          <option>POST</option>
          <option>PUT</option>
          <option>PATCH</option>
          <option>DELETE</option>
          <option>HEAD</option>
          <option>OPTIONS</option>
        </select>
        <input id="url" type="text" placeholder="https://api.example.com/users" value="" />
        <button id="sendBtn">Send</button>
      </div>

      <div class="field">
        <label>Headers</label>
        <textarea id="headers" placeholder="Content-Type: application/json&#10;Authorization: Bearer token"></textarea>
        <div class="hint">每行一个：Key: Value</div>
      </div>

      <div class="field" style="margin-bottom: 0;">
        <label>Body</label>
        <textarea id="body" placeholder='{"name":"test"}'></textarea>
      </div>
    </div>

    <div class="panel">
      <h2>Response</h2>

      <div id="empty" style="color: #64748b; padding: 40px 0; text-align: center;">
        点击 Send 发送请求
      </div>

      <div id="result" style="display: none; flex-direction: column; flex: 1; min-height: 0;">
        <div class="meta">
          <span id="statusBadge" class="badge">-</span>
          <span>⏱ <span id="duration">0</span> ms</span>
          <span>📦 <span id="size">0</span> B</span>
        </div>

        <div class="tabs">
          <div class="tab active" data-tab="body">Body</div>
          <div class="tab" data-tab="headers">Headers</div>
        </div>

        <div id="tab-body" class="tab-content active">
          <pre id="respBody"></pre>
        </div>
        <div id="tab-headers" class="tab-content">
          <div style="overflow: auto; flex: 1;">
            <table class="headers-table"><tbody id="respHeaders"></tbody></table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./src/main.js" type="module"></script>
</body>
</html>
